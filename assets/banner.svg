<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Local Organic Mart — Kathmandu Valley">
  <title>Local Organic Mart</title>
  <style>
    .frame { fill: #070b08; stroke: #c6a15b; stroke-opacity: 0.22; }
    .rule { stroke: #c6a15b; stroke-opacity: 0.45; }

    /* crest: square draws itself, leaf fades in behind it */
    .crest { stroke: #c6a15b; stroke-opacity: 0.55; fill: none; stroke-dasharray: 240; stroke-dashoffset: 240; animation: draw 1s ease-out 0.25s forwards, glow 6s ease-in-out 2s infinite; }
    .leaf { fill: #c6a15b; opacity: 0; animation: fade 0.7s ease-out 0.95s forwards; }
    .vein { stroke: #070b08; stroke-width: 1.2; fill: none; opacity: 0; animation: fade 0.7s ease-out 1.15s forwards; }

    .word { fill: #f4f0e6; font-family: Georgia, "Iowan Old Style", "Times New Roman", serif; font-size: 54px; letter-spacing: 7px; }
    .kicker { fill: #c6a15b; fill-opacity: 0.85; font-family: Georgia, "Iowan Old Style", "Times New Roman", serif; font-size: 12px; letter-spacing: 9px; }

    .rise { opacity: 0; animation: rise 0.9s cubic-bezier(0.22, 0.9, 0.3, 1) forwards; }
    .d1 { animation-delay: 1.05s; }
    .d2 { animation-delay: 1.35s; }
    .d3 { animation-delay: 1.6s; }

    .grow { transform: scaleX(0); animation: grow 0.8s ease-out 1.45s forwards; }
    .grow-l { transform-origin: 470px 0; }
    .grow-r { transform-origin: 730px 0; }

    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes grow { to { transform: scaleX(1); } }
    @keyframes rise { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fade { to { opacity: 1; } }
    @keyframes glow {
      0%, 100% { stroke-opacity: 0.55; }
      50% { stroke-opacity: 0.9; }
    }

    @media (prefers-reduced-motion: reduce) {
      .crest, .leaf, .vein, .rise, .grow { animation: none; opacity: 1; transform: none; }
      .crest { stroke-dashoffset: 0; }
    }
  </style>

  <rect class="frame" x="16.5" y="16.5" width="1167" height="267" />

  <!-- crest -->
  <g transform="rotate(45 600 74)">
    <rect class="crest" x="578" y="52" width="44" height="44" />
  </g>
  <g transform="rotate(-45 600 74)">
    <path class="leaf" d="M600 60c9 7 9 21 0 28-9-7-9-21 0-28z" />
    <path class="vein" d="M600 90v5" />
  </g>

  <!-- wordmark -->
  <text class="word rise d1" x="600" y="168" text-anchor="middle">LOCAL ORGANIC MART</text>

  <!-- rule + kicker -->
  <line class="rule grow grow-l" x1="290" y1="202" x2="440" y2="202" />
  <line class="rule grow grow-r" x1="760" y1="202" x2="910" y2="202" />
  <text class="kicker rise d2" x="600" y="206" text-anchor="middle">KATHMANDU VALLEY</text>

  <!-- rule + footnote -->
  <line class="rule grow grow-l" x1="380" y1="240" x2="500" y2="240" style="stroke-opacity: 0.18" />
  <line class="rule grow grow-r" x1="700" y1="240" x2="820" y2="240" style="stroke-opacity: 0.18" />
  <text class="kicker rise d3" x="600" y="244" text-anchor="middle" fill-opacity="0.7" style="font-size: 10px; letter-spacing: 6px;">FARM TO HOME</text>
</svg>
